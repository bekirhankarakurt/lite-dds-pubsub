name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLDDS_WERROR=ON
        env:
          CXX: ${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: |
          ./build/bin/lossy_link_demo
          ./build/bin/ldds_bench --path mem --latency-samples 200 --throughput-samples 2000

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLDDS_SANITIZE=ON -DLDDS_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: clang-tidy + cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          python3 -m pip install cppcheck==1.5.3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: clang-tidy -p build $(git ls-files 'src/*.cpp' 'apps/*.cpp' 'bench/*.cpp' 'tests/*.cpp')
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr \
            --suppressions-list=.cppcheck-suppressions --suppress=missingIncludeSystem \
            -I include --std=c++17 --quiet src apps bench tests
