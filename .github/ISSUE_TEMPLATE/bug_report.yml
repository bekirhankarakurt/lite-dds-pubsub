name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran. A capture from `dds_spy --record` helps for protocol problems.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, compiler and version, network setup (single host or LAN).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      render: text
